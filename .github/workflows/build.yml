name: build-kext

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-15: default Xcode 16.x matches the project format current
    # brew xcodegen generates. macos-14's Xcode 15 cannot read it
    # ("Unable to read project", exit 74) - seen on run 35283135540.
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Build kext
        run: |
          set -o pipefail
          # Legacy -target builds place products under SYMROOT (not
          # DerivedData); make it explicit so later steps are deterministic.
          xcodebuild -project QCA9377.xcodeproj \
            -target QCA9377 -configuration Release SYMROOT=build build \
            2>&1 | tee build.log | xcbeautify
          test -d build/Release/QCA9377.kext

      - name: Locate and sanity-check the built kext
        run: |
          KEXT=build/Release/QCA9377.kext
          plutil -lint "$KEXT/Contents/Info.plist"
          file "$KEXT/Contents/MacOS/QCA9377"
          nm "$KEXT/Contents/MacOS/QCA9377" | awk '$3=="_kmod_info" && $2!="U"{found=1} END{exit !found}' || {
            echo "FATAL: _kmod_info not DEFINED — OpenCore prelink injection rejects kexts without a real kmod_info (Invalid Parameter)"
            exit 1
          }
          kextlibs -c "$KEXT" || true   # warns are ok; unresolved symbols are not

      - name: Upload kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: QCA9377-kext
          path: build/Release/QCA9377.kext/Contents/**
          if-no-files-found: error

      - name: Attach kext to rolling release
        # download-artifact endpoints need auth; public release assets do
        # not. The dev machine has no HTTPS token (SSH-only gh), so the
        # artifact must be fetchable with plain curl.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/Release
          zip -qry QCA9377.kext.zip QCA9377.kext
          cd ../..
          gh release delete kext-latest --yes --cleanup-tag || true
          gh release create kext-latest build/Release/QCA9377.kext.zip \
            --target "$GITHUB_SHA" --title "kext build" --notes "rolling CI artifact"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  advisory:
    # Stricter-flags audit: surfaces latent issues without blocking releases
    # (the build job stays the release gate).
    runs-on: macos-15
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen xcbeautify
      - name: Generate project
        run: xcodegen generate
      - name: Build with -Wextra -Wpedantic
        run: |
          set -o pipefail
          xcodebuild -project QCA9377.xcodeproj \
            -target QCA9377 -configuration Release SYMROOT=build-advisory \
            OTHER_CPLUSPLUSFLAGS='(inherited) -Wextra -Wpedantic' \
            2>&1 | tee advisory.log | xcbeautify
      - name: Advisory report
        if: always()
        run: |
          echo "=== warnings from our sources (skeleton/) ==="
          grep -E 'skeleton/.*warning:' advisory.log || echo "none"
          grep -cE 'skeleton/.*warning:' advisory.log | sed 's/^/total: /' || true
