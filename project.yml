# project.yml - XcodeGen spec for the QCA9377 M1 skeleton kext.
# CI (and any Mac) runs: xcodegen generate && xcodebuild -project QCA9377.xcodeproj
#   -scheme QCA9377 -configuration Release build
#
# Note: xcodegen has no native "kernel-extension" product type (verified:
# tuist/xcodeproj PBXProductType enum has no com.apple.product-type.kernel-
# extension case), so we use product-type bundle + WRAPPER_EXTENSION=kext,
# kernel cflags, and -lkmod -Wl,-kext to produce a loadable kext.
name: QCA9377
options:
  bundleIdPrefix: com.bswork
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  QCA9377:
    type: bundle
    platform: macOS
    sources:
      - path: skeleton/QCA9377Driver.cpp
    settings:
      base:
        PRODUCT_NAME: QCA9377
        WRAPPER_EXTENSION: kext
        PRODUCT_BUNDLE_IDENTIFIER: com.bswork.QCA9377
        INFOPLIST_FILE: skeleton/Info.plist
        # Kernel-extension compile/link flags (what Xcode's kext template emits):
        OTHER_CFLAGS: "$(inherited) -fapple-kext -fno-exceptions -fno-rtti -fno-check-new -fvisibility=hidden -mkernel"
        # -nostdlib++ is required: the clang++ driver links libc++ by default
        # for C++ targets, and a generic 'bundle' product gets userspace link
        # behavior (run 35283350787: 'library not found for -lc++'). Kernel
        # C++ (OSObject etc.) resolves via the kmod/kernel link, not libc++.
        OTHER_LDFLAGS: "$(inherited) -nostdlib++ -lkmod -Wl,-kext"
        # NOTE: no CLANG_CXX_LIBRARY here - linking userspace libc++ into a
        # kext fails ("library not found for -lc++") and would be wrong even
        # if it linked; the kernel provides its own C++ runtime via libkern.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) KERNEL=1 KERNEL_PRIVATE=1 DRIVER_PRIVATE=1 _KERNEL=1"
        HEADER_SEARCH_PATHS: "$(inherited) $(SDKROOT)/System/Library/Frameworks/Kernel.framework/Headers"
        SDKROOT: macosx
        # Ad-hoc-free: signing disabled outright; ad-hoc signature is applied
        # later only if the target system requires it (see README).
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: x86_64
